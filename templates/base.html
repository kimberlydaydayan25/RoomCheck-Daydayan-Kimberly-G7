<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RoomCheck</title>
</head>
<body>
  <nav>
    <a href="{% url 'dashboard' %}">RoomCheck</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
